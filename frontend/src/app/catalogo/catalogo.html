<app-navbar></app-navbar>

<div class="page-container">
  <h1 class="page-title">Catálogo</h1>

  <div class="filters">
    <mat-form-field appearance="outline" class="filter-search">
      <mat-label>Buscar producto</mat-label>
      <input
        matInput
        [formControl]="busqueda"
        placeholder="Ej: camiseta, jeans..."
        (keyup.enter)="onBuscar()"
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-select">
      <mat-label>Categoría</mat-label>
      <mat-select [formControl]="categoria" (selectionChange)="onFiltroCategoria()">
        <mat-option [value]="null">Todas</mat-option>
        <mat-option *ngFor="let c of categorias" [value]="c.id_categoria">
          {{ c.nombre }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="onBuscar()">
      <mat-icon>filter_alt</mat-icon>
      Buscar
    </button>
  </div>

  <div class="center-block" *ngIf="cargando">
    <mat-spinner></mat-spinner>
  </div>

  <mat-error *ngIf="error" class="cat-error">{{ error }}</mat-error>

  <div class="content-grid" *ngIf="!cargando && productos.length > 0">
    <mat-card
      class="product-card"
      *ngFor="let p of productos"
      (click)="verProducto(p.id_producto)"
    >
      <img
        mat-card-image
        class="product-img"
        [src]="p.imagen_url || 'assets/placeholder.svg'"
        (error)="onImagenError($event)"
        alt="{{ p.nombre }}"
      />
      <mat-card-header>
        <mat-card-title>{{ p.nombre }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="price">{{ p.precio | currency: 'Bs.' : 'symbol' : '1.2-2' }}</p>
        <p *ngIf="p.descripcion" class="desc">{{ p.descripcion }}</p>
      </mat-card-content>
    </mat-card>
  </div>

  <div class="empty" *ngIf="!cargando && productos.length === 0 && !error">
    <mat-icon>search_off</mat-icon>
    <p>No se encontraron productos con los filtros aplicados.</p>
  </div>
</div>
