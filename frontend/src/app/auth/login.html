<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>FashionStore</mat-card-title>
      <mat-card-subtitle>Inicia sesión</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onLogin()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Correo electrónico</mat-label>
          <input matInput formControlName="email" type="email" placeholder="tu@correo.com" />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="form.get('email')?.hasError('required')">El correo es obligatorio</mat-error>
          <mat-error *ngIf="form.get('email')?.hasError('email')">Correo inválido</mat-error>
        </mat-form-field>

        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            formControlName="contrasena"
            [type]="ocultar ? 'password' : 'text'"
            placeholder="••••••••"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="ocultar = !ocultar"
            [attr.aria-label]="'Mostrar contraseña'"
          >
            <mat-icon>{{ ocultar ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('contrasena')?.hasError('required')">La contraseña es obligatoria</mat-error>
          <mat-error *ngIf="form.get('contrasena')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <mat-error *ngIf="error" class="error-msg">{{ error }}</mat-error>

        <div class="actions">
          <button
            mat-raised-button
            color="primary"
            class="full-width"
            type="submit"
            [disabled]="form.invalid || cargando"
          >
            <mat-spinner *ngIf="cargando" diameter="20"></mat-spinner>
            <span *ngIf="!cargando">Ingresar</span>
          </button>
        </div>
      </form>

      <div class="register-link">
        ¿No tienes cuenta?
        <a routerLink="/registro">Regístrate</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
